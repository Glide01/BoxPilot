[package]
name = "boxpilot-protocol"
version = "0.1.0"
edition = "2021"
description = "The wire protocol between BoxPilot and its privileged helper (ADR 0006)"
authors = ["BoxPilot Contributors"]
license = "MIT"
repository = "https://github.com/Glide01/BoxPilot"
publish = false

[lib]
name = "boxpilot_protocol"

[dependencies]
# The attachment id rule, and the refusals a `refused` reply carries.
boxpilot-policy = { path = "../boxpilot-policy" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
