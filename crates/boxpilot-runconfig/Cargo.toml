[package]
name = "boxpilot-runconfig"
version = "0.1.0"
edition = "2021"
description = "The parts of a sing-box run config BoxPilot injects itself, shared by the GUI and its privileged helper (ADR 0006)"
authors = ["BoxPilot Contributors"]
license = "MIT"
repository = "https://github.com/Glide01/BoxPilot"
publish = false

[lib]
name = "boxpilot_runconfig"

[dependencies]
# `preserve_order` as in the policy crate: the injected config keeps the
# profile's key order, and the GUI's graph turns it on anyway.
serde_json = { version = "1.0", features = ["preserve_order"] }
