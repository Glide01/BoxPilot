[package]
name = "boxpilot-helper"
version = "0.1.0"
edition = "2021"
description = "BoxPilot's privileged helper: runs sing-box for TUN mode on a config it has checked (ADR 0006)"
authors = ["BoxPilot Contributors"]
license = "MIT"
repository = "https://github.com/Glide01/BoxPilot"
publish = false

# The modules are a library so the cross-platform core is tested on every OS
# and nothing in it reads as dead code where the binary is only a stub.
[lib]
name = "boxpilot_helper"

[[bin]]
name = "boxpilot-helper"
path = "src/main.rs"

[dependencies]
# What may run on the privileged path, and how it is asked for.
boxpilot-policy = { path = "../boxpilot-policy" }
boxpilot-protocol = { path = "../boxpilot-protocol" }
# The inbounds, cache file and `api` service, written as the GUI writes them.
boxpilot-runconfig = { path = "../boxpilot-runconfig" }
# The install manifest (strict, as the protocol's messages are) and the run
# config the helper writes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The manifest's SHA-256 of sing-box and the files beside it. Already in the
# graph (rust-embed-utils), so this adds no new crate.
sha2 = "0.10"
# The `api` service's per-run secret and the run directory's name, from the
# OS RNG. Already in the graph at 0.3, as the GUI uses it.
getrandom = "0.3"

# The platform layer (`src/win`). The same `windows` version as the GUI's,
# so the graph holds one copy; the features are the calls the helper makes:
# - Foundation, Security, Security_Authorization: handles, SIDs, tokens,
#   security descriptors (GetSecurityInfo, SDDL), impersonation;
# - Storage_FileSystem, System_IO, System_Pipes: the overlapped named pipe,
#   CreateDirectoryW, the stdout/stderr pipes;
# - System_Threading, System_JobObjects: CreateProcessW with a handle list,
#   events, the job object;
# - System_Services: the SCM entry;
# - Devices_DeviceAndDriverInstallation: removing stale sing-tun adapters;
# - System_SystemInformation, UI_Shell, System_Com: the Windows directory
#   and the known folders (and freeing their path);
# - System_LibraryLoader: SetDefaultDllDirectories.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
