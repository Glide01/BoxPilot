# .github/workflows/release.yml
# Build and package the Windows, Linux and macOS releases of BoxPilot.
#
# windows — MSI. GPUI's Windows backend (DirectX 11 + MSVC `windows` crate
#           bindings) does not support MinGW cross-compilation; Zed upstream
#           rejects MinGW builds, so this runs natively on `windows-latest`.
# linux   — x86_64 AppImage, built on ubuntu-22.04 so the binary only needs
#           the older glibc that ships there.
# macos   — one DMG per architecture (arm64, x86_64), signed ad hoc. GPUI's
#           Metal shaders are compiled with Xcode's `xcrun metal`, so this
#           runs natively on a macOS runner, never cross from Linux.
# publish — attaches all of them to the GitHub release once every build
#           succeeds; only for the release branches and version tags.

name: Build Release

on:
  push:
    branches:
      - main
      - master
      - dev
    # Version tags (v1.13.0) publish an immutable versioned release — the
    # winget manifest points at those assets, so they must never be
    # overwritten. Branch pushes keep feeding the rolling ci-latest build.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "sing-box version to bundle, without leading v (e.g. 1.11.0). Blank = use repo variable SINGBOX_VERSION."
        required: false
        default: ""

# sing-box version bundled into the MSI, the AppImage and the DMGs. Pinned explicitly
# (no implicit "latest") so builds are reproducible and never silently grab
# the wrong version. Set the repo/org Actions variable SINGBOX_VERSION, or
# override per-run via the workflow_dispatch input above. The download steps
# fail fast if neither is set. Optionally set SINGBOX_SHA256 (Windows .zip),
# SINGBOX_SHA256_LINUX (linux-amd64 .tar.gz), SINGBOX_SHA256_DARWIN_ARM64 and
# SINGBOX_SHA256_DARWIN_AMD64 (darwin-* .tar.gz) to the asset digests shown
# on the sing-box release page to pin the archive contents.
env:
  SINGBOX_VERSION: ${{ inputs.singbox_version || vars.SINGBOX_VERSION }}

# The build jobs only read the repo. The publish job alone gets
# contents: write, which the built-in GITHUB_TOKEN needs to create/update the
# releases (and the rolling ci-latest tag).
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # On version-tag builds, fail fast if the tag doesn't match the crate
      # version — the MSI's ProductVersion (and the winget manifest that will
      # point at it) comes from Cargo.toml, so a mismatched tag would publish
      # a release whose assets claim a different version than the tag says.
      # The tag name is read via the runner-provided env var, never
      # interpolated into the script.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $m.Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag 'v$tag' does not match Cargo.toml version '$cargo'. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          }
          Write-Host "Tag v$tag matches Cargo.toml version $cargo"

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The key hashes Cargo.lock + Cargo.toml, so every version bump is a
      # guaranteed miss — and version bumps are exactly the builds that ship.
      # restore-keys falls back to the newest earlier cache, which still holds
      # every compiled dependency (gpui dominates); only our own crate, whose
      # version actually changed, rebuilds.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msvc-

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Download sing-box from official GitHub release
        run: |
          # Read the version from the env var (set at workflow level), never
          # interpolated into the script — avoids workflow injection.
          $ver = "$env:SINGBOX_VERSION".Trim().TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver)) {
            Write-Error "SINGBOX_VERSION is not set. Set the repo variable SINGBOX_VERSION (e.g. 1.11.0) or pass 'singbox_version' via Run workflow."
            exit 1
          }
          # Validate the format up front: digits + dots, optional pre-release
          # suffix. Rejects anything that isn't a plausible sing-box tag.
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            Write-Error "SINGBOX_VERSION '$ver' is not a valid version (expected e.g. 1.11.0)."
            exit 1
          }
          $asset = "sing-box-$ver-windows-amd64"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/$asset.zip"
          Write-Host "Downloading sing-box $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile "sing-box.zip"

      # Verify the archive as downloaded, before anything touches it. The
      # expected hash is the asset digest GitHub shows on the sing-box release
      # page — copy it into the SINGBOX_SHA256 variable when bumping
      # SINGBOX_VERSION (it hashes the .zip, not the inner exe).
      - name: Verify sing-box archive integrity
        if: vars.SINGBOX_SHA256 != ''
        env:
          SINGBOX_SHA256: ${{ vars.SINGBOX_SHA256 }}
        run: |
          $expected = "$env:SINGBOX_SHA256".Trim() -replace '^sha256:', ''
          $hash = (Get-FileHash -Algorithm SHA256 "sing-box.zip").Hash
          if ($hash -ne $expected) {
            Write-Error "sing-box.zip SHA256 mismatch! Expected: $expected, Got: $hash"
            exit 1
          }
          Write-Host "sing-box.zip SHA256 verified: $hash"

      - name: Extract and stage sing-box
        run: |
          New-Item -ItemType Directory -Force -Path "release"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "singbox-extract" -Force
          # Robust against future folder-layout changes: just find the exe.
          $exe = Get-ChildItem -Path "singbox-extract" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "sing-box.exe not found inside the downloaded archive."
            exit 1
          }
          Copy-Item $exe.FullName -Destination "release/sing-box.exe"
          Write-Host "Bundled sing-box from $($exe.FullName)"

      # The privileged helper's directory (ADR 0006 rules 3 and 7), which
      # wix/main.wxs installs into the fixed [ProgramFiles64Folder]BoxPilot\Helper:
      # the helper (the Build step builds every default member, the helper
      # crate included), its own copy of sing-box, the libcronet.dll the
      # archive ships beside sing-box.exe if any, and manifest.json with
      # their SHA-256. Staged under the target dir so the MSI's sources sit
      # next to the others; the script empties the directory first, so a
      # copy restored from the cache never leaks in.
      - name: Stage the privileged helper
        run: |
          $ver = "$env:SINGBOX_VERSION".Trim().TrimStart('v')
          $exe = @(Get-ChildItem -Path "singbox-extract" -Recurse -Filter "sing-box.exe")
          if ($exe.Count -ne 1) {
            Write-Error "Expected one sing-box.exe in the archive, found $($exe.Count)."
            exit 1
          }
          ./packaging/windows/stage-helper.ps1 `
            -Helper target/x86_64-pc-windows-msvc/release/boxpilot-helper.exe `
            -SingBox $exe[0].FullName `
            -SingBoxVersion $ver `
            -OutDir target/x86_64-pc-windows-msvc/release/helper

      # The helper refuses to run on a manifest it can't parse or files
      # that don't match it, so check them here with its own parser, and
      # that wix/main.wxs installs exactly the staged files. No -p: the same
      # package set as the Test step, so the same features, and the test
      # binary it built runs without recompiling anything.
      - name: Check the staged helper
        run: |
          $env:BOXPILOT_HELPER_STAGE = (Resolve-Path "target/x86_64-pc-windows-msvc/release/helper").Path
          $env:BOXPILOT_HELPER_SINGBOX_VERSION = "$env:SINGBOX_VERSION".Trim().TrimStart('v')
          cargo test --target x86_64-pc-windows-msvc --test install_manifest -- --ignored

      # The helper's sing-box runs as SYSTEM, and the GUI that starts it gets
      # its `api` service's secret, so every RPC of that service runs as
      # SYSTEM for the GUI. A new one must be audited before it does (ADR
      # 0006, "Audited at every SINGBOX_VERSION bump"):
      # crates/boxpilot-helper/tests/api_rpcs.rs lists the audited RPCs, and
      # this fails the release when the bundled version's
      # daemon/started_service.proto declares any other set. $ver was
      # validated by the download step.
      - name: Check sing-box's API RPCs against the audited list
        run: |
          $ver = "$env:SINGBOX_VERSION".Trim().TrimStart('v')
          $proto = Join-Path $env:RUNNER_TEMP "started_service.proto"
          $url = "https://raw.githubusercontent.com/SagerNet/sing-box/v$ver/daemon/started_service.proto"
          Write-Host "Fetching $url"
          Invoke-WebRequest -Uri $url -OutFile $proto
          $env:BOXPILOT_SINGBOX_PROTO = $proto
          cargo test --target x86_64-pc-windows-msvc --test api_rpcs -- --ignored

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Install cargo-wix
        run: cargo install cargo-wix@0.3.9

      - name: Stage sing-box for MSI build
        run: |
          Copy-Item "release/sing-box.exe" -Destination "target/x86_64-pc-windows-msvc/release/sing-box.exe"

      # The repository is a Cargo workspace (the GUI plus crates/), and
      # cargo-wix refuses to guess which member to package. HelperLibcronet
      # tells wix/main.wxs whether the helper directory holds libcronet.dll,
      # read from the staged directory the manifest was written from.
      - name: Build MSI installer
        run: |
          $cronet = if (Test-Path -LiteralPath "target/x86_64-pc-windows-msvc/release/helper/libcronet.dll") { "yes" } else { "no" }
          cargo wix --package box_pilot_gui --no-build --nocapture --target x86_64-pc-windows-msvc -C "-dHelperLibcronet=$cronet" -o release/

      # Hand the MSI to the publish job. Artifacts count against the Actions
      # storage quota (release assets don't), so keep them only as long as
      # the hand-off needs. Everything Windows gets (BoxPilot, its sing-box
      # and the privileged helper's directory) is inside the MSI, so the MSI
      # is the only Windows asset.
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: boxpilot-windows
          path: release/*.msi
          if-no-files-found: error
          retention-days: 3

      # ---- The privileged helper, installed and driven on this runner ----
      #
      # The helper was built and unit-tested on Linux; these steps install the
      # MSI just built on this runner (elevated, and thrown away afterwards)
      # and drive the BoxPilotHelper service from outside with a smoke client
      # (crates/boxpilot-helper/examples/service_smoke.rs, never shipped), as
      # the runner's administrator and as a fresh standard account. Each step
      # is one stage of packaging/windows/helper-smoke.ps1, which has a
      # function per check. They come after "Upload MSI", so the MSI is
      # uploaded whatever they find. This is Windows Server: the client SKUs
      # and the rest of docs/helper-windows-checklist.md stay manual.
      - name: Build the helper smoke client
        run: cargo build --release --target x86_64-pc-windows-msvc -p boxpilot-helper --example service_smoke

      - name: "Helper smoke: install the MSI"
        id: helper-install
        timeout-minutes: 10
        run: ./packaging/windows/helper-smoke.ps1 -Step install -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: the installed service, files and folders"
        timeout-minutes: 5
        run: ./packaging/windows/helper-smoke.ps1 -Step inspect -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: the protocol and TUN as an administrator"
        timeout-minutes: 15
        run: ./packaging/windows/helper-smoke.ps1 -Step protocol -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: the idle exit"
        timeout-minutes: 5
        run: ./packaging/windows/helper-smoke.ps1 -Step idle-exit -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: a standard account"
        timeout-minutes: 10
        run: ./packaging/windows/helper-smoke.ps1 -Step standard-user -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: a broken install's exit codes"
        timeout-minutes: 10
        run: ./packaging/windows/helper-smoke.ps1 -Step broken-install -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: killing the helper kills sing-box"
        timeout-minutes: 10
        run: ./packaging/windows/helper-smoke.ps1 -Step kill-helper -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      - name: "Helper smoke: uninstall the MSI"
        timeout-minutes: 10
        run: ./packaging/windows/helper-smoke.ps1 -Step uninstall -Msi release/*.msi -Smoke target/x86_64-pc-windows-msvc/release/examples/service_smoke.exe

      # The helper's own log (HelperState\helper.log, readable by
      # administrators only, which the runner is), the MSI logs and the smoke
      # client's background output, whatever the steps above found.
      - name: "Helper smoke: logs"
        if: always() && steps.helper-install.outcome != 'skipped'
        timeout-minutes: 5
        run: ./packaging/windows/helper-smoke.ps1 -Step logs

  linux:
    # 22.04 rather than ubuntu-latest: the AppImage links the host glibc, so
    # building against an older one lets it run on more distributions.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Cargo.toml version
        run: |
          cargo_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read the package version from Cargo.toml."
            exit 1
          fi
          echo "CARGO_VERSION=$cargo_version" >> "$GITHUB_ENV"

      # Same check as the Windows job: the AppImage file name comes from
      # Cargo.toml, so a mismatched tag would publish assets that claim a
      # different version than the tag says. The tag name is read via the
      # runner-provided env var, never interpolated into the script.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$CARGO_VERSION" ]; then
            echo "::error::Tag 'v$tag' does not match Cargo.toml version '$CARGO_VERSION'. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          fi
          echo "Tag v$tag matches Cargo.toml version $CARGO_VERSION"

      # Link-time deps of gpui's X11/Wayland backends and its font stack
      # (xkbcommon + xkbcommon-x11, fontconfig, freetype). Wayland and Vulkan
      # are loaded at runtime, but their headers keep the -sys crates happy.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # Same keying and fallback as the Windows cache (see there).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gnu-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gnu-

      - name: Test
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Download sing-box from official GitHub release
        run: |
          # Read the version from the env var (set at workflow level), never
          # interpolated into the script — avoids workflow injection.
          ver=$(printf '%s' "$SINGBOX_VERSION" | tr -d '[:space:]')
          ver="${ver#v}"
          if [ -z "$ver" ]; then
            echo "::error::SINGBOX_VERSION is not set. Set the repo variable SINGBOX_VERSION (e.g. 1.11.0) or pass 'singbox_version' via Run workflow."
            exit 1
          fi
          # Validate the format up front: digits + dots, optional pre-release
          # suffix. Rejects anything that isn't a plausible sing-box tag.
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::SINGBOX_VERSION '$ver' is not a valid version (expected e.g. 1.11.0)."
            exit 1
          fi
          asset="sing-box-$ver-linux-amd64"
          url="https://github.com/SagerNet/sing-box/releases/download/v$ver/$asset.tar.gz"
          echo "Downloading sing-box $ver from $url"
          curl -fsSL --retry 3 -o sing-box.tar.gz "$url"

      # Verify the archive as downloaded, before anything touches it. The
      # expected hash is the asset digest GitHub shows on the sing-box release
      # page — copy it into the SINGBOX_SHA256_LINUX variable when bumping
      # SINGBOX_VERSION (it hashes the .tar.gz, not the inner binary).
      - name: Verify sing-box archive integrity
        if: vars.SINGBOX_SHA256_LINUX != ''
        env:
          SINGBOX_SHA256_LINUX: ${{ vars.SINGBOX_SHA256_LINUX }}
        run: |
          expected=$(printf '%s' "$SINGBOX_SHA256_LINUX" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          expected="${expected#sha256:}"
          hash=$(sha256sum sing-box.tar.gz | cut -d ' ' -f 1)
          if [ "$hash" != "$expected" ]; then
            echo "::error::sing-box.tar.gz SHA256 mismatch! Expected: $expected, Got: $hash"
            exit 1
          fi
          echo "sing-box.tar.gz SHA256 verified: $hash"

      - name: Extract and stage sing-box
        run: |
          mkdir -p release singbox-extract
          tar -xzf sing-box.tar.gz -C singbox-extract
          # Robust against future folder-layout changes: just find the binary.
          bin=$(find singbox-extract -type f -name sing-box | head -n 1)
          if [ -z "$bin" ]; then
            echo "::error::sing-box not found inside the downloaded archive."
            exit 1
          fi
          install -m 0755 "$bin" release/sing-box
          echo "Bundled sing-box from $bin"

      - name: Build AppImage
        run: |
          packaging/linux/build-appimage.sh \
            target/x86_64-unknown-linux-gnu/release/box_pilot_gui \
            release/sing-box \
            "$CARGO_VERSION" \
            release

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: boxpilot-linux
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 3

  macos:
    # macos-14 is Apple silicon: arm64 builds natively and runs the tests;
    # x86_64 is cross-compiled with the same Xcode (its tests would only
    # run under Rosetta).
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            singbox_asset: darwin-arm64
            test: true
          - arch: x86_64
            target: x86_64-apple-darwin
            singbox_asset: darwin-amd64
            test: false
    env:
      # Matches LSMinimumSystemVersion in packaging/macos/Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Cargo.toml version
        run: |
          cargo_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read the package version from Cargo.toml."
            exit 1
          fi
          echo "CARGO_VERSION=$cargo_version" >> "$GITHUB_ENV"

      # Same check as the Windows and Linux jobs: the DMG names come from
      # Cargo.toml. The tag name is read via the runner-provided env var,
      # never interpolated into the script.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$CARGO_VERSION" ]; then
            echo "::error::Tag 'v$tag' does not match Cargo.toml version '$CARGO_VERSION'. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          fi
          echo "Tag v$tag matches Cargo.toml version $CARGO_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Same keying and fallback as the Windows cache (see there), per
      # target. Restored and saved as two steps so that a failed build
      # still saves its compiled dependencies (gpui dominates).
      - name: Restore cargo registry and target
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Save cargo registry and target
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Download sing-box from official GitHub release
        env:
          SINGBOX_ASSET: ${{ matrix.singbox_asset }}
        run: |
          # Read the version from the env var (set at workflow level), never
          # interpolated into the script — avoids workflow injection.
          ver=$(printf '%s' "$SINGBOX_VERSION" | tr -d '[:space:]')
          ver="${ver#v}"
          if [ -z "$ver" ]; then
            echo "::error::SINGBOX_VERSION is not set. Set the repo variable SINGBOX_VERSION (e.g. 1.11.0) or pass 'singbox_version' via Run workflow."
            exit 1
          fi
          # Validate the format up front: digits + dots, optional pre-release
          # suffix. Rejects anything that isn't a plausible sing-box tag.
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::SINGBOX_VERSION '$ver' is not a valid version (expected e.g. 1.11.0)."
            exit 1
          fi
          asset="sing-box-$ver-$SINGBOX_ASSET"
          url="https://github.com/SagerNet/sing-box/releases/download/v$ver/$asset.tar.gz"
          echo "Downloading sing-box $ver from $url"
          curl -fsSL --retry 3 -o sing-box.tar.gz "$url"

      # Verify the archive as downloaded, before anything touches it. The
      # expected hash is the asset digest GitHub shows on the sing-box release
      # page — copy it into SINGBOX_SHA256_DARWIN_ARM64 / _AMD64 when bumping
      # SINGBOX_VERSION (it hashes the .tar.gz, not the inner binary).
      - name: Verify sing-box archive integrity
        if: (matrix.arch == 'arm64' && vars.SINGBOX_SHA256_DARWIN_ARM64 != '') || (matrix.arch == 'x86_64' && vars.SINGBOX_SHA256_DARWIN_AMD64 != '')
        env:
          EXPECTED_SHA256: ${{ matrix.arch == 'arm64' && vars.SINGBOX_SHA256_DARWIN_ARM64 || vars.SINGBOX_SHA256_DARWIN_AMD64 }}
        run: |
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          expected="${expected#sha256:}"
          hash=$(shasum -a 256 sing-box.tar.gz | cut -d ' ' -f 1)
          if [ "$hash" != "$expected" ]; then
            echo "::error::sing-box.tar.gz SHA256 mismatch! Expected: $expected, Got: $hash"
            exit 1
          fi
          echo "sing-box.tar.gz SHA256 verified: $hash"

      - name: Extract and stage sing-box
        run: |
          mkdir -p release singbox-extract
          tar -xzf sing-box.tar.gz -C singbox-extract
          # Robust against future folder-layout changes: just find the binary.
          bin=$(find singbox-extract -type f -name sing-box | head -n 1)
          if [ -z "$bin" ]; then
            echo "::error::sing-box not found inside the downloaded archive."
            exit 1
          fi
          install -m 0755 "$bin" release/sing-box
          echo "Bundled sing-box from $bin"

      - name: Build DMG
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          packaging/macos/build-dmg.sh \
            "target/$TARGET/release/box_pilot_gui" \
            release/sing-box \
            "$CARGO_VERSION" \
            "$ARCH" \
            release

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: boxpilot-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [windows, linux, macos]
    # Only the release branches and version tags publish. PRs only build/test
    # (fork PRs lack write access anyway), and a manual run on any other
    # branch must not overwrite the rolling ci-latest release.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Publish to a single rolling pre-release ("ci-latest") — release
      # assets don't count against the Actions artifact storage quota, and
      # each push overwrites the assets so there's always one current build
      # to download. Skipped on pull_request.
      - name: Publish to rolling CI release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        # Third-party action holding contents:write — pinned to a full commit
        # SHA (not the mutable @v2 tag) to prevent a moved/compromised tag from
        # running with our release token. Bump deliberately (or via Dependabot).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ci-latest
          name: CI build (latest)
          prerelease: true
          body: |
            Rolling CI build from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            sing-box `${{ env.SINGBOX_VERSION }}` bundled in the MSI, the AppImage and the macOS DMGs.

            macOS DMGs are not notarized: after copying BoxPilot to Applications, allow its first open in System Settings › Privacy & Security › "Open Anyway", or run `xattr -dr com.apple.quarantine /Applications/BoxPilot.app`.
          files: |
            release/*.msi
            release/*.AppImage
            release/*.dmg

      # Version tags publish a real (non-prerelease) release with immutable
      # assets. The winget manifest records this URL + the MSI's SHA256, so
      # never re-push a version tag or replace its assets — publish a new
      # version instead.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: BoxPilot ${{ github.ref_name }}
          body: |
            BoxPilot ${{ github.ref_name }} — sing-box `${{ env.SINGBOX_VERSION }}` bundled in the MSI, the AppImage and the macOS DMGs.

            Windows: install via winget: `winget install Glide01.BoxPilot`, or run the MSI.
            Linux (x86_64): download the AppImage, `chmod +x` it and run it.
            macOS 12 or later: download the DMG for your Mac (`arm64` for Apple silicon, `x86_64` for Intel) and drag BoxPilot to Applications. It is signed ad hoc, not notarized, so macOS blocks the first open: allow it in System Settings › Privacy & Security › "Open Anyway", or run `xattr -dr com.apple.quarantine /Applications/BoxPilot.app`. Proxy mode only for now: TUN mode is not available on macOS yet.

            BoxPilot is MIT licensed. The bundled `sing-box` binaries are the official
            [SagerNet/sing-box](https://github.com/SagerNet/sing-box) release binaries,
            distributed under their own GPL-3.0-or-later license.
          files: |
            release/*.msi
            release/*.AppImage
            release/*.dmg
